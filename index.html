        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {

                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length

                }

                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script>
        // Smooth Scrolling (excluding disabled links)
        document.querySelectorAll('a[href^="#"]:not(.disabled)').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    window.scrollTo({
                        top: target.getBoundingClientRect().top + window.pageYOffset - 60,
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Mobile Menu Toggle
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Search Dropdown Toggle and Close
        const searchIcon = document.querySelector('.search-icon');
        const searchDropdown = document.querySelector('.search-dropdown');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.querySelector('.search-btn');
        const closeBtn = document.querySelector('.close-btn');

        // Ensure dropdown is hidden on load
        searchDropdown.style.display = 'none';

        // Preload content from all pages
        const pageContent = {};
        async function loadPageContent() {
            const pages = [
                'index.html',
                'about/about_index.html',
                'contact/contact_index.html'
            ];

            for (const page of pages) {
                try {
                    const response = await fetch(page);
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    pageContent[page] = doc.body.textContent.toLowerCase();
                } catch (error) {
                    console.error(`Failed to load ${page}:`, error);
                }
            }
        }

        // Scroll to section containing search query on page load
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('search');
            if (query) {
                const sections = document.querySelectorAll('section');
                for (const section of sections) {
                    if (section.textContent.toLowerCase().includes(query.toLowerCase())) {
                        window.scrollTo({
                            top: section.getBoundingClientRect().top + window.pageYOffset - 60,
                            behavior: 'smooth'
                        });
                        break;
                    }
                }
            }
        });

        // Load content when the page loads
        window.addEventListener('load', loadPageContent);

        searchIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (searchDropdown.style.display !== 'flex') {
                searchDropdown.style.display = 'flex';
                searchInput.focus();
            }
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            searchDropdown.style.display = 'none';
        });

        document.addEventListener('click', (e) => {
            if (!searchDropdown.contains(e.target) && !searchIcon.contains(e.target)) {
                searchDropdown.style.display = 'none';
            }
        });

        // Search Functionality
        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.toLowerCase().trim();
            if (query) {
                let found = false;
                for (const [page, content] of Object.entries(pageContent)) {
                    if (content.includes(query)) {
                        // Append search query as URL parameter
                        window.location.href = `${page}?search=${encodeURIComponent(query)}`;
                        found = true;
                        searchDropdown.style.display = 'none';
                        break;
                    }
                }
                if (!found) {
                    alert('No results found for "' + query + '"');
                }
            }
        });
    </script>
